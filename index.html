<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlayHub — Free Online Games (Demo)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#0f1222;color:#e8eaf2;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:#161a30;border-bottom:1px solid #262c4d;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;background:linear-gradient(90deg,#ffd54a,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.badge{font-size:10px;background:#2c3358;color:#ffd54a;border-radius:8px;padding:3px 8px;font-weight:700}
.search{flex:1;min-width:150px;max-width:420px;margin-left:auto}
.search input{width:100%;padding:9px 14px;border-radius:20px;border:1px solid #2c3358;background:#0f1222;color:#e8eaf2;outline:none}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:#131728;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:7px 14px;border-radius:16px;background:#1d2340;border:1px solid #2c3358;font-size:13px;color:#e8eaf2;cursor:pointer}
.pill.on{background:#ffd54a;color:#1a1a1a;border-color:#ffd54a;font-weight:700}
main{padding:16px;max-width:1200px;margin:0 auto}
h1{font-size:22px;margin:6px 0 4px}.sub{color:#8b93b8;font-size:13px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:#161a30;border:1px solid #262c4d;border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-3px);border-color:#ffd54a}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#1d2340}
.card .t{padding:9px 10px;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .c{padding:0 10px 10px;font-size:11px;color:#8b93b8;text-transform:capitalize}
.player{position:relative;width:100%;aspect-ratio:16/10;background:#000;border-radius:12px;overflow:hidden;border:1px solid #262c4d}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gmeta{background:#161a30;border:1px solid #262c4d;border-radius:12px;padding:18px;margin-top:14px}
.tag{display:inline-block;background:#1d2340;border:1px solid #2c3358;border-radius:12px;padding:3px 10px;font-size:12px;color:#ffd54a;margin-bottom:10px;text-transform:capitalize}
.gmeta p{color:#c3c9e0;font-size:14.5px;line-height:1.7;margin:8px 0}
.gmeta h3{margin:14px 0 6px;font-size:15px;color:#ffd54a}
.back{display:inline-block;margin-bottom:12px;color:#8b93b8;font-size:13px;cursor:pointer}
footer{text-align:center;color:#5a6285;font-size:12px;padding:26px 16px;border-top:1px solid #1d2340;margin-top:30px}
.nores{color:#8b93b8;text-align:center;padding:40px 0}
@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:10px}}
</style></head><body>
<header><span class="logo">🎮 PlayHub</span><span class="badge">DEMO</span>
<div class="search"><input id="q" placeholder="Search games..." oninput="setQ(this.value)"></div></header>
<div class="cats" id="cats"></div>
<main id="main"></main>
<footer>PlayHub demo preview — games embedded from the official publisher feed.<br>Built automatically · zero manual work · demo link expires.</footer>
<script>
var GAMES=[{"t": "SUMI", "c": ".io", "img": "https://img.gamedistribution.com/e87b78e351904f658bd260289c28df5e-512x384.jpg", "e": "https://html5.gamedistribution.com/e87b78e351904f658bd260289c28df5e/", "d": "You are a ball.\nThere are other balls.\nYou have to shoot them.\n\nSurvive. Get stronger. Go further. And most importantly get the highest score you possibly can.\n\nDesigned to be simple, relaxing, and easy to pick up, but surviving for a long time won't be quite as easy as it seems.\n\nHow long can you survive?"}, {"t": "Jelly Yeet!", "c": "adventure", "img": "https://img.gamedistribution.com/1496176c7aa34ca28a6d4446a7bad34f-512x384.jpg", "e": "https://html5.gamedistribution.com/1496176c7aa34ca28a6d4446a7bad34f/", "d": "Launch a bouncy jelly from the backyard into space! Time your swing for a perfect hit, bounce off trampolines, bump into airborne objects, and travel through portals. Use your mid-air slam to keep the action going, earn coins, and upgrade your power, bounce, and slam. Unlock funny jelly skins and unique clubs, then chase your next distance record!"}, {"t": "Vex 10", "c": "agility", "img": "https://img.gamedistribution.com/57820e917cff42488d174341b8866760-512x384.jpg", "e": "https://html5.gamedistribution.com/57820e917cff42488d174341b8866760/", "d": "Vex 10 is here - and this time, Vex takes a different turn! Take on brand-new Acts filled with deadly traps, tricky obstacles, and game-changing mechanics. Walk on ceilings with upside-down gravity, switch between characters, rotate platforms, and avoid invisible booby traps. Freeze time to safely bypass obstacles, or take on the all-new Challenge Mode where you control multiple Vex characters at once. Can you master every Act and become the ultimate Vex champion?"}, {"t": "Card Clash : Battle Arena", "c": "battle", "img": "https://img.gamedistribution.com/1ab0c43c073e4de9a5fe96985d1ec084-512x384.jpg", "e": "https://html5.gamedistribution.com/1ab0c43c073e4de9a5fe96985d1ec084/", "d": "Card Clash: Battle Arena is an exciting card-merge battle game where strategy and timing decide victory!\n\nMerge cards of the same color to create powerful characters.\nAfter merging 5 identical cards, a unique hero is summoned to the battlefield. These heroes automatically fight enemies, pushing forward step by step.\n\nDefeat all enemies to advance, then lead your characters to destroy the enemy base and complete the level!"}, {"t": "Ninja Platformer Rage", "c": "casual", "img": "https://img.gamedistribution.com/03b06aa3d44347adbae7bcd64a97b947-512x384.jpg", "e": "https://html5.gamedistribution.com/03b06aa3d44347adbae7bcd64a97b947/", "d": "Master your ninja skills in a challenging platformer where every jump matters!\n\nRun, jump and overcome 50 handcrafted levels filled with traps, obstacles and unexpected challenges. Use your shadow to reach places you normally can't, then teleport back to it at the perfect moment.\n\nSome levels will test your reflexes, others your precision — and some might completely mess with your sense of scale and perspective.\n\nCan you beat all 50 levels?"}, {"t": "Paradise Journey: Match3", "c": "match-3", "img": "https://img.gamedistribution.com/038d7e3491744b86a5c34a27928c6bfa-512x384.jpg", "e": "https://html5.gamedistribution.com/038d7e3491744b86a5c34a27928c6bfa/", "d": "Set sail on a tranquil journey across a breathtaking tropical archipelago. In this premium match- adventure, you are not just solving puzzles – you are restoring the vibrant soul of paradise itself. Follow a gentle narrative as you help a young traveler rediscover the forgotten beauty of the islands, one match at a time."}, {"t": "Save My Human", "c": "puzzle", "img": "https://img.gamedistribution.com/e467181fa05241fb971e10bed482cb48-512x384.jpg", "e": "https://html5.gamedistribution.com/e467181fa05241fb971e10bed482cb48/", "d": "Step into the paws of a hero cat! Navigate tile by tile through tricky puzzles and dangerous paths to rescue your beloved human. Can you save your favorite owner?\n\nIt’s up to you, a brave little cat, to rescue your human!"}, {"t": "Drag Shift: Street Race", "c": "racing & driving", "img": "https://img.gamedistribution.com/fbf001a776c3441085069d4990ad64ea-512x384.jpg", "e": "https://html5.gamedistribution.com/fbf001a776c3441085069d4990ad64ea/", "d": "Master the launch, nail every shift and burn NOS in Drag Shift: Street Race, a precision neon drag-racing game. Climb 3 districts and 60 events, beat 18 rival crew drivers, tune 25 cars with 5 upgrade paths, and chase your own ghost for the perfect run. Easy to learn, hard to master — how low can your ET go?"}, {"t": "Goblin Mine", "c": "simulation", "img": "https://img.gamedistribution.com/f15c2937a8744eccb66194b6f12881a8-512x384.jpg", "e": "https://html5.gamedistribution.com/f15c2937a8744eccb66194b6f12881a8/", "d": "Goblin Mine is a 2D mining simulator where you explore underground zones, break valuable ores, fill your backpack, and sell your haul for coins. Upgrade your pickaxe, backpack, speed, and power to reach deeper mines. Unlock 15 zones, hatch pets, complete achievements and daily quests, collect Gems, and rebirth for permanent bonuses. How deep can you mine?"}, {"t": "Beach Volleyball Clash: Summer Smash", "c": "sports", "img": "https://img.gamedistribution.com/c6d37f6c6bd64d0281b1b49c081f472f-512x384.jpg", "e": "https://html5.gamedistribution.com/c6d37f6c6bd64d0281b1b49c081f472f/", "d": "Spike, dive and block your way to victory on a sunny beach! Beach Volley Clash is a fast arcade volleyball game you can play against the computer, with a friend on one keyboard, in 2v2 to 4v4 team matches with AI teammates, or online with friends. Hit glowing orbs to charge Fireball, Ice Ball and Multiball super throws, and earn coins to unlock new characters and ball skins."}, {"t": "Reversi Evolved", "c": "strategy", "img": "https://img.gamedistribution.com/109278662e8844dbaa7802cb8386b40f-512x384.jpg", "e": "https://html5.gamedistribution.com/109278662e8844dbaa7802cb8386b40f/", "d": "This classic strategy game, featuring a variety of exciting gameplay variants, transforms every match into a unique experience. Built around the traditional 8×8 grid and the original rules players know and love, it emphasizes strategic thinking, smart positioning, and the ability to anticipate your opponent’s moves, creating a balanced experience that is easy to learn but challenging to master."}, {"t": "Heist Crew", "c": "adventure", "img": "https://img.gamedistribution.com/9d52b7011e4141aa9b837ac743ce21fe-512x384.jpg", "e": "https://html5.gamedistribution.com/9d52b7011e4141aa9b837ac743ce21fe/", "d": "Heist Crew is a fast-paced bank heist strategy and action game where you control a crew of specialists and pull off increasingly challenging robberies. Switch between crew members, hack secured doors, disable security systems, avoid guards and cameras, crack vaults, collect the loot, and escape in your getaway vehicle. Each job introduces tougher security and new challenges, rewarding careful planning, stealth, timing, and quick decisions."}, {"t": "Bike Obby Draw Pencil", "c": "agility", "img": "https://img.gamedistribution.com/ccb3b200322c4779957dfee55c68f3fc-512x384.jpg", "e": "https://html5.gamedistribution.com/ccb3b200322c4779957dfee55c68f3fc/", "d": "Use your creativity and reflexes to complete the missing paths in 3D Side Platform Obby Draw Pencil! Draw paths with your pencil across the gaps between platforms to help your character move forward safely. Overcome different obstacles in each level, draw the right path, and reach the finish without falling. This fun adventure may look simple, but it requires focus, precision, and perfect timing. Get your pencil ready and draw your own path to victory!"}, {"t": "Scribble Slash", "c": "battle", "img": "https://img.gamedistribution.com/0fbaeb2b044c4d069465b4e04ea335f6-512x384.jpg", "e": "https://html5.gamedistribution.com/0fbaeb2b044c4d069465b4e04ea335f6/", "d": "Your pen is your weapon! Draw on the notebook page to slash, lasso and zap waves of scribbled monsters. Every shape does something different: slash through monsters, draw a circle to lasso a whole group, scribble a zigzag for lightning, a spiral for a tornado, a triangle for a shield, or tap for an ink bomb. Pick power cards as you level up, beat giant bosses like the Paint Golem, the Ink Dragon and the Spider Queen, and travel through new worlds. How long can you survive the scribble storm?"}, {"t": "Strike Bullet", "c": "casual", "img": "https://img.gamedistribution.com/d554bf92ae96460cb7e4ec329e31c003-512x384.jpg", "e": "https://html5.gamedistribution.com/d554bf92ae96460cb7e4ec329e31c003/", "d": "Strike Bullet is a ricochet puzzle shooter. Aim carefully, bounce your shot off metal walls, and take out every enemy. Plan your angle, watch the trajectory, and clear 20 levels packed with challenge!"}, {"t": "Screw Sort Master", "c": "match-3", "img": "https://img.gamedistribution.com/88028f7616bc46a6a2a1dfa98964f6a3-512x384.jpg", "e": "https://html5.gamedistribution.com/88028f7616bc46a6a2a1dfa98964f6a3/", "d": "Screw Sort Master is the ultimate satisfying puzzle experience! Tap colorful screws to sort them into matching slots — fill a slot with 3 same-colored screws and watch them burst away in a satisfying pop! With procedurally generated endless levels, combo multipliers, and that perfect ASMR feel, you'll keep coming back for \"just one more level.\" Stuck? Watch a rewarded ad to free a slot and keep going! Play anywhere — no download needed, one tap to start."}, {"t": "Color Block Pairs", "c": "puzzle", "img": "https://img.gamedistribution.com/05ccd7d35a964a51836d6f756d652a0c-512x384.jpg", "e": "https://html5.gamedistribution.com/05ccd7d35a964a51836d6f756d652a0c/", "d": "Move colorful blocks around the board, connect matching colors in pairs, and clear every block to complete the level!\nThere are no timers and no rush — take your time and plan every move. Frozen and linked blocks, restricted movement paths, and other mechanics turn each level into a new puzzle.\nUse boosters whenever you need a little help. Want a higher score? Connect pairs while the combo is active to increase your multiplier."}, {"t": "Monsters Wheels 2", "c": "racing & driving", "img": "https://img.gamedistribution.com/d1aa2402c7754b2eb037c7581e64807a-512x384.jpg", "e": "https://html5.gamedistribution.com/d1aa2402c7754b2eb037c7581e64807a/", "d": "Monsters Wheels 2 is a monster truck game where every event asks something different. Race a packed grid to the finish line, flatten a row of parked cars, land the biggest backflip you can or beat the clock — 24 levels in total, spread across jungles, a beach, an amusement park and the Arizona desert. Three monster trucks are available, each with upgrades for engine, suspension, tyres and nitro. Prize money from every event goes straight into the garage."}, {"t": "Node Conquest", "c": "strategy", "img": "https://img.gamedistribution.com/bec9f449afbd4e0d85a707a09363bef0-512x384.jpg", "e": "https://html5.gamedistribution.com/bec9f449afbd4e0d85a707a09363bef0/", "d": "Node Conquest is a tactical strategy game where you command a futuristic force across interconnected battlefields. Capture and defend strategic nodes, deploy forces between territories, manage resources, use powerful abilities, upgrade your forces, and adapt your strategy as enemy resistance increases. Plan your attacks carefully, secure key positions, and conquer the battlefield one node at a time."}, {"t": "terror in backrooms valley", "c": "adventure", "img": "https://img.gamedistribution.com/524a77b916a44e5fbae2bb94651986e7-512x384.jpg", "e": "https://html5.gamedistribution.com/524a77b916a44e5fbae2bb94651986e7/", "d": "Terror in Backrooms Valley is a cinematic horror visual novel where every decision can change your fate.\n\nYou awaken inside an impossible place filled with endless yellow corridors, abandoned motels, flooded tunnels, forgotten research rooms, and a mysterious valley hidden beyond reality. As you search for a way out, you meet strange survivors, uncover disturbing clues, and discover that the Backrooms may know more about your past than you do."}, {"t": "Marble Maze", "c": "agility", "img": "https://img.gamedistribution.com/500476821acf49d89fcdb425cbf48b81-512x384.jpg", "e": "https://html5.gamedistribution.com/500476821acf49d89fcdb425cbf48b81/", "d": "Roll. Dodge red. Reach green.\nGuide a glossy marble through wild worlds where danger comes disguised as decoy holes, spinning blades, moving walls, and toxic blobs. Grab coins, chain power-ups, and ride a hot streak into GOLD RUSH. Unlock skins, chase stars, and see how far \"one more level\" takes you."}, {"t": "Zombie Survival: Dead Hunt", "c": "battle", "img": "https://img.gamedistribution.com/1bf2fda77339412489ffa06dae12c087-512x384.jpg", "e": "https://html5.gamedistribution.com/1bf2fda77339412489ffa06dae12c087/", "d": "Survive the zombie apocalypse in Zombie Survival: Dead Hunt! Fight waves of deadly undead enemies, aim carefully, shoot fast, and stay alive as long as possible. Become the ultimate zombie killer and test your shooting, reaction, and survival skills. Keep moving, avoid getting surrounded, eliminate zombies, and beat your highest score. If you love zombie games, zombie shooters, zombie killing games, survival games, and action games, the undead are waiting for you!"}, {"t": "Pixel Path 2", "c": "casual", "img": "https://img.gamedistribution.com/38f736f8530e4f7493bf41a70bbbeaba-512x384.jpg", "e": "https://html5.gamedistribution.com/38f736f8530e4f7493bf41a70bbbeaba/", "d": "You'll play as Pixel Tadpole. You'll have to navigate twenty challenging levels. The difficulty increases with each level. You'll need to be attentive and agile to complete them all. Spikes, pits, and falling coconuts are just a few of the challenging challenges that await you. Your nervous system will need to be strong to successfully complete the levels. Only the most experienced players will be able to complete this game."}, {"t": "Block Slide", "c": "puzzle", "img": "https://img.gamedistribution.com/fd87802acd154aae8a4425c061dc528b-512x384.jpg", "e": "https://html5.gamedistribution.com/fd87802acd154aae8a4425c061dc528b/", "d": "Block Slide is a minimalist sliding block puzzler. Swipe or press an arrow key and every block slides until it hits a wall or another block get each onto its matching target to clear the level. 130 levels introduce mechanics gradually: teleporters, arrow tiles, sticky blocks, pins, pressure traps, rotators, conveyors, and multi-board levels solved in parallel. Play on desktop or mobile portrait and landscape adapt automatically."}, {"t": "Frogie - Cross the road", "c": "casual", "img": "https://img.gamedistribution.com/989e979ba8974d40ae7a68936b2d7a2b-512x384.jpg", "e": "https://html5.gamedistribution.com/989e979ba8974d40ae7a68936b2d7a2b/", "d": "Guide your frog through fast-paced lanes, dodge dangerous obstacles, and survive as long as possible in this fun and addictive arcade challenge!\n\nSwipe or use keyboard controls to move left, right, or jump forward while carefully timing every move. The further you go, the more intense the challenge becomes. Collect points, improve your reflexes, and beat your highest score in this colorful HTML5 web game built for quick and engaging gameplay sessions."}, {"t": "Choco Blast : Block Merge", "c": "puzzle", "img": "https://img.gamedistribution.com/0c9d047ce9c54b20bfc013b27d4864c9-512x384.jpg", "e": "https://html5.gamedistribution.com/0c9d047ce9c54b20bfc013b27d4864c9/", "d": "Indulge your sweet tooth with **Choco Blast**, the delicious block puzzle game! Arrange chocolate blocks, clear rows and columns, and create massive combos to earn high scores. Enjoy rich chocolate-themed visuals, satisfying sound effects, smooth drag-and-drop controls, combo rewards, and a helpful revive feature. Easy to learn yet challenging to master, Choco Blast is completely free, works offline, and delivers hours of relaxing puzzle fun!"}];
var CAT='All',Q='';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function card(i){var g=GAMES[i];return '<div class="card" onclick="openGame('+i+')"><img loading="lazy" src="'+esc(g.img)+'" alt="'+esc(g.t)+'"><div class="t">'+esc(g.t)+'</div><div class="c">'+esc(cap(g.c))+'</div></div>'}
function filtered(){return GAMES.map(function(g,i){return i}).filter(function(i){var g=GAMES[i];var q=Q;
return (CAT==='All'||g.c===CAT)&&(g.t.toLowerCase().indexOf(q)>=0||g.c.indexOf(q)>=0)})}
function renderCats(){var cs=['All'].concat([".io", "adventure", "agility", "battle", "casual", "match-3", "puzzle", "racing & driving", "simulation", "sports", "strategy"]);document.getElementById('cats').innerHTML=cs.map(function(c){
return '<span class="pill'+(c===CAT?' on':'')+'" onclick="setCat(\''+c+'\')">'+esc(cap(c))+'</span>'}).join('')}
function setCat(c){CAT=c;renderCats();renderHome()}
function setQ(v){Q=v.toLowerCase();renderHome()}
function renderHome(){var idx=filtered();
var h='<h1>🔥 Popular Free Online Games</h1><div class="sub">'+GAMES.length+' games · play instantly, no download</div>';
h+='<div class="grid">'+idx.map(card).join('')+'</div>';
if(!idx.length)h+='<div class="nores">No games found.</div>';
document.getElementById('main').innerHTML=h;window.scrollTo(0,0)}
function openGame(i){var g=GAMES[i];
var rel=GAMES.map(function(x,j){return j}).filter(function(j){return j!==i&&GAMES[j].c===g.c}).slice(0,6);
var h='<span class="back" onclick="renderHome()">\u2190 All games</span>';
h+='<div class="player"><iframe src="'+esc(g.e)+'" scrolling="no" allowfullscreen allow="autoplay; fullscreen"></iframe></div>';
h+='<div class="gmeta"><span class="tag">'+esc(cap(g.c))+'</span><h1>'+esc(g.t)+'</h1><p>'+esc(g.d||'Play '+g.t+' free online in your browser. No download needed.')+'</p>';
h+='<h3>How to play</h3><p>Click inside the game window to start. Most games use mouse, touch, or arrow keys / WASD \u2014 instructions appear when the game loads.</p></div>';
h+='<h1 style="margin-top:22px">More '+esc(cap(g.c))+' games</h1><div class="grid">'+rel.map(card).join('')+'</div>';
document.getElementById('main').innerHTML=h;window.scrollTo(0,0)}
renderCats();renderHome();
</script></body></html>
